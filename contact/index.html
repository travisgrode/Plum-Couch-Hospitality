<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact · Plum Couch Hospitality</title>
<meta name="description" content="Get in touch with Plum Couch Hospitality about player development and VIP host program consulting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/img/plane-smoke-cream.png" alt="Plum Couch Hospitality"></a>
    <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation">☰</button>
    <nav class="primary-nav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/principles/">Principles</a></li>
        <li><a href="/work/">The Work</a></li>
        <li><a href="/blog/">Insights</a></li>
        <li><a href="/contact/" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="hero" style="padding-bottom: 40px;">
    <div class="wrap hero-grid">
      <div class="hero-content">
        <div class="eyebrow">Contact</div>
        <h1>Let's talk about your program.</h1>
        <p class="lede">
          Send a note about where things stand, or grab time directly on the calendar
          below, whichever is easier.
        </p>
      </div>
      <div class="hero-visual">
        <img class="is-compact" src="/assets/img/wordmark-gold-accent.png" alt="Plum Couch Hospitality">
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 class="section-heading" style="font-size:1.3rem;">Send a message</h2>
      <form class="contact-form" action="https://formspree.io/f/xppqroqd" method="POST">
        <input type="hidden" name="_subject" value="New message from plumcouchhospitality.com">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="company">Company / Property</label>
          <input type="text" id="company" name="company">
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div>
          <button class="btn btn-primary" type="submit">Send message</button>
        </div>
      </form>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 class="section-heading" style="font-size:1.3rem;">Or book time directly</h2>
      <div class="calendly-embed">
        <iframe
          src="https://calendly.com/travisgrode/30min"
          width="100%"
          height="700"
          frameborder="0"
          title="Schedule time with Plum Couch Hospitality">
        </iframe>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-copy"><img class="footer-mark" src="/assets/img/plane-smoke-cream.png" alt=""><span>&copy; <span id="year"></span> Plum Couch Hospitality</span></div>
    <div><a href="/contact/">Contact</a></div>
  </div>
</footer>

<script src="/js/main.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
